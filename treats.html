<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Treats | Lulu Ridge Rat Bakery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Lulu Ridge Rat Bakery</div>
      <a class="nav-link" href="index.html">Home</a>
    </header>

    <main class="page treats-page">
      <div class="coming-soon-banner">MORE TREATS COMING SOON!</div>

      <section class="product-card card">
        <div class="product-image">
          <img
            src="https://images.unsplash.com/photo-1590779033100-9f60a05a013d?auto=format&fit=crop&w=900&q=80"
            alt="Pumpkin meal bites"
          />
        </div>

        <div class="product-copy">
          <p class="eyebrow">Featured Treat</p>
          <h1>PumpkinMeal Bites (Not For Human Consumption)</h1>
          <p class="price">$2.50 each</p>

          <div class="quantity-picker">
            <label for="quantity-selector">Quantity</label>
            <input id="quantity-selector" type="range" min="1" max="10" value="1" />
            <div class="quantity-readout"><span id="quantity-value">1</span> treat(s)</div>
          </div>

          <ul>
            <li>Made with pumpkin and gentle ingredients</li>
            <li>Small-batch and no added sugar</li>
            <li>For rats only — not intended for people</li>
          </ul>
          <a id="buy-button" class="primary-btn" href="payment.html?quantity=1">Buy This Treat</a>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
