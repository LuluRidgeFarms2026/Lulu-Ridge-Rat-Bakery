<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Lulu Ridge Rat Bakery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Lulu Ridge Rat Bakery</div>
    </header>

    <main class="page home">
      <section class="hero card">
        <div class="hero-copy">
          <p class="eyebrow">Rat-approved treats</p>
          <h1>Homemade snacks for tiny foodies.</h1>
          <p>
            Small-batch, wholesome treats made with ingredients that are safe and
            simple for domestic rats.
          </p>
          <div class="cta-stack">
            <a class="primary-btn" href="treats.html">Order Treats Here</a>
            <button id="google-signin" class="google-btn" type="button">
              Continue with Google
            </button>
          </div>
        </div>

        <div class="hero-image-wrap">
          <img
            src="https://images.unsplash.com/photo-1535241749838-299277b6305e?auto=format&fit=crop&w=900&q=80"
            alt="Domestic black and white rat"
          />
        </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="script.js"></script>
