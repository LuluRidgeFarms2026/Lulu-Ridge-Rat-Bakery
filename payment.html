<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment | Lulu Ridge Rat Bakery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Lulu Ridge Rat Bakery</div>
      <a class="nav-link" href="treats.html">Back to Treats</a>
    </header>

    <main class="page payment-page">
      <div class="payment-banner" role="status">We Accept CashApp Payments Only Sorry But this will Hopefully Change Soon</div>
      <section class="card payment-card">
        <p class="eyebrow">Secure Local Checkout</p>
        <h1>PumpkinMeal Bites</h1>
        <p class="total" id="payment-total">Total: $2.50</p>

        <form id="checkout-form">
          <label>
            Full Name
            <input type="text" id="customer-name" name="name" placeholder="Full Name" autocomplete="name" required />
          </label>

          <label>
            Age
            <input type="number" id="customer-age" name="age" min="1" max="120" required />
          </label>

          <label>
            Email
            <input type="email" id="customer-email" name="email" placeholder="Email" autocomplete="email" required />
          </label>

          <label>
            Shipping Address
            <textarea id="shipping-address" name="address" rows="4" autocomplete="street-address" required></textarea>
          </label>

          <label class="consent-check">
            <input type="checkbox" id="sms-consent" name="smsConsent" required />
            I agree to receive order updates by SMS.
          </label>

          <label>
            Payment Method
            <select id="payment-method" name="paymentMethod">
              <option value="cashapp">Cash App</option>
            </select>
          </label>

          <div id="checkout-errors" role="alert" class="error-message"></div>
          <div id="payment-instructions" class="info-message"></div>
          <button type="submit" class="primary-btn" id="checkout-submit-button">Pay</button>
        </form>

        <div id="cashapp-qr-codes" class="cashapp-qr-codes" hidden></div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="payment-handler.js?v=3"></script>
  </body>
</html>
