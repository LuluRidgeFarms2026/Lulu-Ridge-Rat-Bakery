<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment | Lulu Ridge Rat Bakery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Lulu Ridge Rat Bakery</div>
      <a class="nav-link" href="treats.html">Back to Treats</a>
    </header>

    <main class="page payment-page">
      <section class="card payment-card">
        <p class="eyebrow">Checkout</p>
        <h1>PumpkinMeal Bites</h1>
        <p class="total">Total: $2.50</p>

        <form id="payment-form" class="payment-form">
          <label>
            Full Name
            <input type="text" name="name" placeholder="Full Name" required />
          </label>

          <label>
            Email
            <input type="email" name="email" placeholder="Email" required />
          </label>

          <div id="card-errors" role="alert" class="error-message"></div>

          <button type="submit" class="primary-btn" id="submit-button">Pay $2.50</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="stripe-payment.js"></script>
  </body>
</html>
